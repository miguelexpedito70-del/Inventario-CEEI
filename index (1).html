<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEEI · Inventário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{--navy:#16254a;--navy-dark:#0f1a33;--red:#d11f2a;--red-dark:#b51922;--bg:#f5f6f8;--text:#101a33;--muted:#5b6785;--line:#e1e5ec;--ok:#0f8a4b;--ok-bg:#d9f2e4}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.logo{display:block;filter:brightness(0) invert(1)}.logo-lg{width:200px}.logo-sm{width:124px}
.sub{color:var(--muted);font-size:.95rem}
.btn{font-family:inherit;font-weight:600;font-size:.95rem;border:0;border-radius:8px;padding:.7rem 1.1rem;cursor:pointer;transition:background .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-red{background:var(--red);color:#fff}.btn-red:hover:not(:disabled){background:var(--red-dark)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover:not(:disabled){background:var(--navy-dark)}
.btn-outline{background:transparent;color:inherit;border:1px solid currentColor}
.btn-full{width:100%;padding:.9rem}
input{font:inherit;width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
input:focus-visible,.btn:focus-visible,.link:focus-visible,.tab:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label{display:block;font-weight:600;font-size:.9rem;margin:1.1rem 0 .4rem}
/* login */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.login-brand{background:linear-gradient(160deg,var(--navy),var(--navy-dark));color:#fff;padding:3.5rem;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{color:var(--red);font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:.85rem}
.login-brand h1{font-size:clamp(4rem,9vw,6rem);font-weight:800;line-height:1;margin:.5rem 0 1rem}
.tagline{font-size:1.4rem;line-height:1.4;max-width:24ch}
.brand-foot{opacity:.85;font-size:.95rem}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding:2rem}
.login-form{width:100%;max-width:480px}
.login-form h2{font-size:2.2rem;font-weight:800}
.login-form .btn{margin-top:1.6rem}
.erro{color:var(--red);font-size:.9rem;margin-top:1rem}
/* topo */
.topbar{background:linear-gradient(90deg,var(--navy),var(--navy-dark));color:#fff;border-bottom:4px solid var(--red)}
.topbar-in{max-width:1400px;margin:0 auto;padding:.9rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.topbar-brand{display:flex;align-items:center;gap:1rem}
.divider{width:1px;height:36px;background:rgba(255,255,255,.3)}
.topbar-brand strong{display:block;font-size:1.25rem;line-height:1.1}.topbar-brand small{opacity:.8}
.topbar-user{display:flex;align-items:center;gap:1rem}.topbar-user .btn{padding:.5rem .9rem}
.aviso{background:#fff4d6;color:#6b4e00;font-size:.88rem;padding:.6rem 2rem;text-align:center}
.aviso.err{background:#fde0e2;color:#8a1118}
/* conteúdo */
.container{max-width:1400px;margin:0 auto;padding:2rem}
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:1.8rem;overflow-x:auto}
.tab{background:none;border:0;font:inherit;font-weight:600;color:var(--muted);padding:.8rem 1.1rem;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--navy);border-color:var(--red)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.5rem}
.page-head h2{font-size:2.2rem;font-weight:800}
.search{padding:1.1rem 1.2rem;margin-bottom:1.5rem}
.lista{display:flex;flex-direction:column;gap:1rem}
.vazio{text-align:center;color:var(--muted);padding:3rem 1rem;background:#fff;border-radius:12px;border:1px dashed var(--line)}
.item{display:grid;grid-template-columns:180px 1fr 300px;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(16,26,51,.1);padding:1rem;gap:1.2rem}
.foto{background:#eaedf3;border-radius:8px;height:180px;display:grid;place-items:center;color:#8a93a8;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.item-info{display:flex;flex-direction:column;min-width:0}
.item-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.item-top h3{font-size:1.3rem;font-weight:700;overflow-wrap:anywhere}
.badge{font-size:.8rem;font-weight:600;padding:.25rem .7rem;border-radius:99px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.badge.falta{background:#fde0e2;color:var(--red)}
.item-info p{color:var(--muted);margin-top:.3rem}
.com{font-size:.88rem;color:#7a5400;background:#fff4d6;border-radius:8px;padding:.4rem .7rem;margin-top:.7rem;width:fit-content;max-width:100%}
.links{margin-top:auto;padding-top:.8rem;display:flex;gap:1.2rem}
.link{background:none;border:0;font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer;padding:0}.link:hover{color:var(--red)}
.item-qtd{border-left:1px solid var(--line);padding-left:1.2rem;text-align:center}
.item-qtd .n{font-size:2.6rem;font-weight:800;line-height:1.1}
.item-qtd .l{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.7rem}
.item-qtd input{text-align:center;padding:.6rem}
.item-qtd .btn-outline{color:var(--navy)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}
.linha{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(16,26,51,.08);padding:.9rem 1.1rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}
.linha strong{font-weight:700}.meta{color:var(--muted);font-size:.88rem}
.ret{color:var(--red)}.add{color:var(--ok)}.emp{color:#9a6b00}
.itens-pessoa{margin-top:.3rem;font-size:.92rem}
/* modais */
dialog{border:0;border-radius:14px;padding:0;width:min(520px,92vw);box-shadow:0 20px 60px rgba(16,26,51,.35)}
dialog::backdrop{background:rgba(15,26,51,.55)}
.modal-body{padding:1.8rem}.modal-body h3{font-size:1.5rem;font-weight:800}
.modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.6rem}
.modal-actions .btn-outline{color:var(--muted)}
.hist{list-style:none;padding:0;margin-top:1rem;max-height:50vh;overflow:auto}
.hist li{padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist small{display:block;color:var(--muted)}
@media(max-width:900px){
.login{grid-template-columns:1fr}.login-brand{padding:2rem;gap:2rem}.login-form-wrap{padding:2.5rem 1.5rem}
.item{grid-template-columns:1fr}.foto{height:200px}
.item-qtd{border-left:0;border-top:1px solid var(--line);padding:1rem 0 0}
.topbar-in,.container{padding-left:1rem;padding-right:1rem}#olaUsuario{display:none}.aviso{padding:.6rem 1rem}}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURAÇÃO — é só isto que você precisa preencher
   ---------------------------------------------------------------------
   1) Crie um projeto no Supabase (supabase.com)
   2) SQL Editor > cole o SQL abaixo (tudo de uma vez) > Run
   3) Project Settings > API: copie "Project URL" (começa com https://)
      e a chave "Publishable key"
   4) Cole os dois valores nas linhas SUPABASE_URL e SUPABASE_ANON_KEY.
   Deixando vazio, o site funciona em modo local (só neste navegador).

   SQL (rodar uma vez):

   create table usuarios (
     id uuid primary key default gen_random_uuid(),
     chave text unique not null, nome text not null, sobrenome text not null,
     acessos int not null default 1,
     primeiro_acesso timestamptz default now(), ultimo_acesso timestamptz default now());
   create table acessos (
     id uuid primary key default gen_random_uuid(),
     quem text not null, criado_em timestamptz default now());
   create table itens (
     id uuid primary key default gen_random_uuid(),
     nome text not null, descricao text default '',
     qtd int not null default 0 check (qtd >= 0),
     foto_url text, foto_path text, criado_em timestamptz default now());
   create table movimentacoes (
     id uuid primary key default gen_random_uuid(),
     item_id uuid references itens(id) on delete set null,
     item_nome text not null,
     tipo text not null check (tipo in ('entrada','retirada','emprestimo','devolucao')),
     qtd int not null check (qtd > 0), quem text not null,
     criado_em timestamptz default now());

   create view emprestimos_abertos with (security_invoker = on) as
     select item_id, quem,
       sum(case when tipo = 'emprestimo' then qtd when tipo = 'devolucao' then -qtd else 0 end)::int as qtd
     from movimentacoes where item_id is not null group by item_id, quem
     having sum(case when tipo = 'emprestimo' then qtd when tipo = 'devolucao' then -qtd else 0 end) > 0;

   alter table usuarios enable row level security;
   alter table acessos enable row level security;
   alter table itens enable row level security;
   alter table movimentacoes enable row level security;
   create policy "ver" on usuarios for select to anon using (true);
   create policy "ver" on acessos for select to anon using (true);
   create policy "ver" on itens for select to anon using (true);
   create policy "excluir" on itens for delete to anon using (true);
   create policy "ver" on movimentacoes for select to anon using (true);

   create function registrar_acesso(p_nome text, p_sobrenome text) returns void
   language plpgsql security definer set search_path = public as $$
   declare v_chave text := lower(trim(p_nome) || ' ' || trim(p_sobrenome));
   begin
     insert into usuarios (chave, nome, sobrenome) values (v_chave, trim(p_nome), trim(p_sobrenome))
     on conflict (chave) do update set acessos = usuarios.acessos + 1, ultimo_acesso = now();
     insert into acessos (quem) values (trim(p_nome) || ' ' || trim(p_sobrenome));
   end $$;

   create function criar_item(p_nome text, p_desc text, p_qtd int, p_foto_url text, p_foto_path text, p_quem text)
   returns uuid language plpgsql security definer set search_path = public as $$
   declare v_id uuid;
   begin
     insert into itens (nome, descricao, qtd, foto_url, foto_path)
     values (trim(p_nome), coalesce(p_desc, ''), greatest(p_qtd, 0), p_foto_url, p_foto_path) returning id into v_id;
     if p_qtd > 0 then
       insert into movimentacoes (item_id, item_nome, tipo, qtd, quem) values (v_id, trim(p_nome), 'entrada', p_qtd, p_quem);
     end if;
     return v_id;
   end $$;

   create function movimentar(p_item uuid, p_tipo text, p_qtd int, p_quem text) returns void
   language plpgsql security definer set search_path = public as $$
   declare v_item itens%rowtype; v_emp int;
   begin
     if p_qtd is null or p_qtd < 1 then raise exception 'Quantidade inválida'; end if;
     select * into v_item from itens where id = p_item for update;
     if not found then raise exception 'Item não encontrado'; end if;
     if p_tipo in ('retirada', 'emprestimo') then
       if v_item.qtd < p_qtd then raise exception 'Estoque insuficiente'; end if;
       update itens set qtd = qtd - p_qtd where id = p_item;
     elsif p_tipo = 'entrada' then
       update itens set qtd = qtd + p_qtd where id = p_item;
     elsif p_tipo = 'devolucao' then
       select coalesce(sum(case when tipo = 'emprestimo' then qtd when tipo = 'devolucao' then -qtd else 0 end), 0)
         into v_emp from movimentacoes where item_id = p_item and lower(quem) = lower(p_quem);
       if v_emp < p_qtd then raise exception 'Você não tem essa quantidade emprestada'; end if;
       update itens set qtd = qtd + p_qtd where id = p_item;
     else
       raise exception 'Tipo inválido';
     end if;
     insert into movimentacoes (item_id, item_nome, tipo, qtd, quem) values (p_item, v_item.nome, p_tipo, p_qtd, p_quem);
   end $$;

   insert into storage.buckets (id, name, public) values ('fotos', 'fotos', true) on conflict do nothing;
   create policy "fotos grupo" on storage.objects for all to anon
     using (bucket_id = 'fotos') with check (bucket_id = 'fotos');
   ===================================================================== */
const SUPABASE_URL = 'https://revgzxuhnrilfmomclvk.supabase.co';        // ex.: 'https://abcdxyz.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_BnauhOx0qedC_EPlB5u7_g_W7c0QaFQ';   // chave Publishable (sb_publishable_...) ou a anon antiga (eyJ...)
const SENHA_DO_GRUPO = '12345678';

/* ---------- Utilidades ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (d) => d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const capitalizar = (s) => s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/(^|\s)\S/g, (m) => m.toUpperCase());
const blobParaUrl = (b) => new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
const TIPOS = { entrada: 'Adicionou', retirada: 'Retirou', emprestimo: 'Pegou emprestado', devolucao: 'Devolveu' };
const COR = { entrada: 'add', devolucao: 'add', retirada: 'ret', emprestimo: 'emp' };

/* ---------- Armazenamento do navegador (se estiver bloqueado, guarda só em memória) ---------- */
const mem = {};
const livre = (() => { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; } catch (e) { return false; } })();
const store = {
  get: (k) => livre ? localStorage.getItem(k) : (k in mem ? mem[k] : null),
  set: (k, v) => { if (livre) localStorage.setItem(k, v); else mem[k] = v; },
  del: (k) => { if (livre) localStorage.removeItem(k); else delete mem[k]; }
};

/* ---------- Conexão com o Supabase (se não der certo, cai no modo local e avisa) ---------- */
let sb = null, erroConfig = '';
try {
  if (SUPABASE_URL.trim() && SUPABASE_ANON_KEY.trim()) {
    if (!window.supabase) throw new Error('a biblioteca do Supabase não carregou (verifique a internet).');
    sb = window.supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim());
  }
} catch (e) { erroConfig = 'Configuração do Supabase inválida: ' + e.message + ' Usando modo local por enquanto.'; }

/* ---------- Camada de dados: Supabase ou modo local (mesmas regras nos dois) ---------- */
const L = {
  ler() { return JSON.parse(store.get('ceei_local') || '{"itens":[],"movs":[],"usuarios":[]}'); },
  gravar(d) { store.set('ceei_local', JSON.stringify(d)); }
};
function calcEmprestimos(movs) {
  const m = {};
  movs.forEach((x) => {
    const s = x.tipo === 'emprestimo' ? x.qtd : x.tipo === 'devolucao' ? -x.qtd : 0;
    if (!x.item_id || !s) return;
    const k = x.item_id + '|' + x.quem.toLowerCase();
    m[k] = m[k] || { item_id: x.item_id, quem: x.quem, qtd: 0 };
    m[k].qtd += s;
  });
  return Object.values(m).filter((e) => e.qtd > 0);
}

const db = {
  async registrarAcesso(nome, sobrenome) {
    if (sb) { const { error } = await sb.rpc('registrar_acesso', { p_nome: nome, p_sobrenome: sobrenome }); if (error) throw error; return; }
    const d = L.ler(), chave = (nome + ' ' + sobrenome).toLowerCase();
    let u = d.usuarios.find((x) => x.chave === chave);
    if (!u) { u = { chave, nome, sobrenome, acessos: 0 }; d.usuarios.push(u); }
    u.acessos++; u.ultimo_acesso = new Date().toISOString();
    L.gravar(d);
  },
  async carregar() {
    if (!sb) {
      const d = L.ler();
      return {
        itens: [...d.itens].sort((a, b) => a.nome.localeCompare(b.nome)), movs: d.movs.slice(0, 300),
        usuarios: [...d.usuarios].sort((a, b) => b.ultimo_acesso.localeCompare(a.ultimo_acesso)), emprestimos: calcEmprestimos(d.movs)
      };
    }
    const r = await Promise.all([
      sb.from('itens').select('*').order('nome'),
      sb.from('movimentacoes').select('*').order('criado_em', { ascending: false }).limit(300),
      sb.from('usuarios').select('*').order('ultimo_acesso', { ascending: false }),
      sb.from('emprestimos_abertos').select('*')
    ]);
    const falhou = r.find((x) => x.error); if (falhou) throw falhou.error;
    return { itens: r[0].data, movs: r[1].data, usuarios: r[2].data, emprestimos: r[3].data };
  },
  async historico(id) {
    if (!sb) return L.ler().movs.filter((m) => m.item_id === id);
    const { data, error } = await sb.from('movimentacoes').select('*').eq('item_id', id).order('criado_em', { ascending: false }).limit(200);
    if (error) throw error; return data;
  },
  async criar({ nome, descricao, qtd, fotoBlob }, quem) {
    if (!sb) {
      const d = L.ler(), id = novoId();
      d.itens.push({ id, nome, descricao, qtd, foto_url: fotoBlob ? await blobParaUrl(fotoBlob) : '' });
      if (qtd) d.movs.unshift({ id: novoId(), item_id: id, item_nome: nome, tipo: 'entrada', qtd, quem, criado_em: new Date().toISOString() });
      return L.gravar(d);
    }
    let foto_url = null, foto_path = null;
    if (fotoBlob) {
      foto_path = novoId() + '.jpg';
      const up = await sb.storage.from('fotos').upload(foto_path, fotoBlob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      foto_url = sb.storage.from('fotos').getPublicUrl(foto_path).data.publicUrl;
    }
    const { error } = await sb.rpc('criar_item', { p_nome: nome, p_desc: descricao, p_qtd: qtd, p_foto_url: foto_url, p_foto_path: foto_path, p_quem: quem });
    if (error) { if (foto_path) sb.storage.from('fotos').remove([foto_path]); throw error; }
  },
  async mover(item, tipo, qtd, quem) {
    if (!sb) {
      const d = L.ler(), it = d.itens.find((x) => x.id === item.id);
      if (tipo === 'retirada' || tipo === 'emprestimo') { if (it.qtd < qtd) throw new Error('Estoque insuficiente'); it.qtd -= qtd; }
      else if (tipo === 'devolucao') {
        const e = calcEmprestimos(d.movs).find((x) => x.item_id === it.id && x.quem.toLowerCase() === quem.toLowerCase());
        if (!e || e.qtd < qtd) throw new Error('Você não tem essa quantidade emprestada'); it.qtd += qtd;
      } else it.qtd += qtd;
      d.movs.unshift({ id: novoId(), item_id: it.id, item_nome: it.nome, tipo, qtd, quem, criado_em: new Date().toISOString() });
      return L.gravar(d);
    }
    const { error } = await sb.rpc('movimentar', { p_item: item.id, p_tipo: tipo, p_qtd: qtd, p_quem: quem });
    if (error) throw error;
  },
  async excluir(item) {
    if (!sb) { const d = L.ler(); d.itens = d.itens.filter((x) => x.id !== item.id); return L.gravar(d); }
    const { error } = await sb.from('itens').delete().eq('id', item.id);
    if (error) throw error;
    if (item.foto_path) sb.storage.from('fotos').remove([item.foto_path]);
  }
};

/* ---------- Estado ---------- */
let D = { itens: [], movs: [], usuarios: [], emprestimos: [] };
let aba = 'estoque';
let usuario = null;
try { usuario = JSON.parse(store.get('ceei_usuario') || 'null'); } catch (e) { usuario = null; }
const quem = () => `${usuario.nome} ${usuario.sobrenome}`;
const souEu = (nome) => usuario && nome.toLowerCase() === quem().toLowerCase();
const falha = (e) => { console.error(e); alert('Não foi possível concluir: ' + (e.message || e)); };

function avisar(msg, erro) {
  const el = $('aviso');
  const texto = msg || erroConfig || (!sb ? (livre ? 'Modo local: os dados ficam só neste navegador.' : 'Modo local temporário: aqui o navegador não deixa salvar, então os dados somem ao fechar.') + ' Preencha a configuração do Supabase no código para compartilhar o estoque com o grupo.' : '');
  el.hidden = !texto; el.textContent = texto; el.className = 'aviso' + (erro || erroConfig ? ' err' : '');
}

/* ---------- Login / sessão ---------- */
function erroLogin(msg) { $('loginErro').textContent = msg; $('loginErro').hidden = false; }

async function entrar() {
  const nome = capitalizar($('nome').value), sobrenome = capitalizar($('sobrenome').value);
  if (!nome || !sobrenome) return erroLogin('Informe nome e sobrenome.');
  if ($('senha').value.trim() !== SENHA_DO_GRUPO) return erroLogin('Senha incorreta. Confira a senha do grupo e tente de novo.');
  usuario = { nome, sobrenome };
  try { store.set('ceei_usuario', JSON.stringify(usuario)); } catch (err) { /* segue sem salvar a sessão */ }
  $('loginErro').hidden = true; ['nome', 'sobrenome', 'senha'].forEach((id) => { $(id).value = ''; });
  await iniciar(true);
}
$('btnEntrar').addEventListener('click', entrar);
$('loginForm').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });

$('btnSair').addEventListener('click', () => {
  store.del('ceei_usuario'); usuario = null;
  $('app').hidden = true; $('login').hidden = false;
});

async function iniciar(novoLogin) {
  if (!usuario) return;
  $('login').hidden = true; $('app').hidden = false;
  $('olaUsuario').textContent = `Olá, ${quem()}`;
  avisar();
  if (novoLogin) { try { await db.registrarAcesso(usuario.nome, usuario.sobrenome); } catch (err) { avisar('Entrou, mas não consegui registrar seu acesso no banco: ' + (err.message || err), true); } }
  await carregar();
}

async function carregar(silencioso) {
  try { D = await db.carregar(); if (sb && !silencioso) avisar(); }
  catch (e) { console.error(e); avisar('Erro ao ler o banco de dados: ' + (e.message || e) + ' (o SQL de configuração já foi executado?)', true); }
  render();
}

/* ---------- Telas ---------- */
const MAPA = {
  estoque: { t: 'Estoque', ph: 'Pesquisar item pelo nome ou descrição...' },
  emprestimos: { t: 'Empréstimos', ph: 'Pesquisar por pessoa ou item...' },
  movs: { t: 'Movimentações', ph: 'Pesquisar por pessoa ou item...' },
  pessoas: { t: 'Pessoas', ph: 'Pesquisar por nome...' }
};
const vazio = (txt) => `<div class="vazio">${txt}</div>`;
const ICO = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
const nomeItem = (id) => (D.itens.find((i) => i.id === id) || {}).nome || 'item removido';

function render() {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.aba === aba));
  $('titulo').textContent = MAPA[aba].t;
  $('busca').placeholder = MAPA[aba].ph;
  $('btnNovo').hidden = aba !== 'estoque';
  const termo = $('busca').value.trim().toLowerCase();
  const disp = D.itens.reduce((s, i) => s + i.qtd, 0), emp = D.emprestimos.reduce((s, e) => s + e.qtd, 0);
  $('resumo').textContent = `${D.itens.length} ${D.itens.length === 1 ? 'item cadastrado' : 'itens cadastrados'} · ${disp} unidades em estoque · ${emp} emprestadas · ${D.itens.filter((i) => i.qtd === 0).length} em falta`;
  $('conteudo').innerHTML = { estoque: telaEstoque, emprestimos: telaEmprestimos, movs: telaMovs, pessoas: telaPessoas }[aba](termo);
}

function telaEstoque(termo) {
  const vis = D.itens.filter((i) => (i.nome + ' ' + (i.descricao || '')).toLowerCase().includes(termo));
  if (!vis.length) return vazio(D.itens.length ? 'Nenhum item encontrado para essa busca.' : 'Nenhum item cadastrado ainda. Clique em “Cadastrar item” para começar.');
  return vis.map((i) => {
    const com = D.emprestimos.filter((e) => e.item_id === i.id);
    const meu = (com.find((e) => souEu(e.quem)) || {}).qtd || 0;
    return `<article class="item" data-id="${i.id}">
      <div class="foto">${i.foto_url ? `<img src="${esc(i.foto_url)}" alt="${esc(i.nome)}" loading="lazy">` : ICO}</div>
      <div class="item-info">
        <div class="item-top"><h3>${esc(i.nome)}</h3><span class="badge ${i.qtd ? '' : 'falta'}">${i.qtd ? 'Disponível' : 'Em falta'}</span></div>
        <p>${esc(i.descricao)}</p>
        ${com.length ? `<div class="com">Emprestado para: ${com.map((e) => `${esc(e.quem)} (${e.qtd})`).join(', ')}</div>` : ''}
        <div class="links"><button class="link" data-acao="historico">Histórico</button><button class="link" data-acao="excluir">Excluir</button></div>
      </div>
      <div class="item-qtd">
        <div class="n">${i.qtd}</div><div class="l">Em estoque</div>
        <input type="number" min="1" value="1" aria-label="Quantidade" data-meu="${meu}">
        <div class="acoes">
          <button class="btn btn-red" data-acao="retirada">Retirar</button>
          <button class="btn btn-navy" data-acao="entrada">Adicionar</button>
          <button class="btn btn-outline" data-acao="emprestimo">Emprestar</button>
          <button class="btn btn-outline" data-acao="devolucao" ${meu ? '' : 'disabled'}>Devolver${meu ? ` (${meu})` : ''}</button>
        </div>
      </div></article>`;
  }).join('');
}

function telaEmprestimos(termo) {
  const por = {};
  D.emprestimos.forEach((e) => { (por[e.quem] = por[e.quem] || []).push(e); });
  const nomes = Object.keys(por).filter((n) => (n + ' ' + por[n].map((e) => nomeItem(e.item_id)).join(' ')).toLowerCase().includes(termo)).sort();
  if (!nomes.length) return vazio(D.emprestimos.length ? 'Nenhum empréstimo encontrado para essa busca.' : 'Nenhuma peça emprestada no momento.');
  return nomes.map((n) => `<div class="linha"><div><strong>${esc(n)}${souEu(n) ? ' (você)' : ''}</strong>
    <div class="itens-pessoa">${por[n].map((e) => `${esc(nomeItem(e.item_id))} × ${e.qtd}`).join(' · ')}</div></div>
    ${souEu(n) ? `<button class="btn btn-navy" data-devolver-tudo="1">Devolver tudo</button>` : ''}</div>`).join('');
}

function telaMovs(termo) {
  const vis = D.movs.filter((m) => (m.quem + ' ' + m.item_nome).toLowerCase().includes(termo));
  if (!vis.length) return vazio('Nenhuma movimentação registrada.');
  return vis.map((m) => `<div class="linha"><div><strong>${esc(m.quem)}</strong> <span class="${COR[m.tipo]}">${TIPOS[m.tipo]} ${m.qtd}</span> · ${esc(m.item_nome)}</div><span class="meta">${fmt(m.criado_em)}</span></div>`).join('');
}

function telaPessoas(termo) {
  const vis = D.usuarios.filter((u) => (u.nome + ' ' + u.sobrenome).toLowerCase().includes(termo));
  if (!vis.length) return vazio('Ninguém entrou ainda.');
  return vis.map((u) => {
    const nome = `${u.nome} ${u.sobrenome}`;
    const tem = D.emprestimos.filter((e) => e.quem.toLowerCase() === nome.toLowerCase());
    return `<div class="linha"><div><strong>${esc(nome)}</strong>${tem.length ? `<div class="itens-pessoa">Com: ${tem.map((e) => `${esc(nomeItem(e.item_id))} × ${e.qtd}`).join(' · ')}</div>` : ''}</div>
      <span class="meta">${u.acessos} ${u.acessos === 1 ? 'acesso' : 'acessos'} · último em ${fmt(u.ultimo_acesso)}</span></div>`;
  }).join('');
}

/* ---------- Ações ---------- */
document.querySelector('.tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  aba = t.dataset.aba; $('busca').value = ''; render();
});
$('busca').addEventListener('input', render);

$('conteudo').addEventListener('click', async (e) => {
  if (e.target.closest('[data-devolver-tudo]')) {
    const meus = D.emprestimos.filter((x) => souEu(x.quem));
    if (!meus.length || !confirm('Devolver todas as peças que estão com você?')) return;
    try { for (const m of meus) await db.mover({ id: m.item_id }, 'devolucao', m.qtd, quem()); } catch (err) { falha(err); }
    return carregar();
  }
  const btn = e.target.closest('[data-acao]'); if (!btn) return;
  const card = btn.closest('.item'), item = D.itens.find((i) => i.id === card.dataset.id), acao = btn.dataset.acao;
  if (acao === 'historico') return abrirHistorico(item);
  try {
    if (acao === 'excluir') {
      const aberto = D.emprestimos.some((x) => x.item_id === item.id);
      if (!confirm(`Excluir "${item.nome}" do estoque?${aberto ? ' Há peças emprestadas deste item.' : ''} Essa ação não pode ser desfeita.`)) return;
      await db.excluir(item);
    } else {
      const inp = card.querySelector('input'), qtd = parseInt(inp.value, 10);
      if (!qtd || qtd < 1) return alert('Informe uma quantidade maior que zero.');
      if (acao !== 'entrada' && acao !== 'devolucao' && qtd > item.qtd) return alert(`Só há ${item.qtd} em estoque.`);
      if (acao === 'devolucao' && qtd > Number(inp.dataset.meu)) return alert(`Você está com ${inp.dataset.meu} deste item.`);
      await db.mover(item, acao, qtd, quem());
    }
  } catch (err) { falha(err); }
  carregar();
});

async function abrirHistorico(item) {
  $('histTitulo').textContent = `Histórico · ${item.nome}`;
  $('histLista').innerHTML = '<li>Carregando...</li>';
  $('modalHist').showModal();
  try {
    const h = await db.historico(item.id);
    $('histLista').innerHTML = h.length
      ? h.map((m) => `<li><span class="${COR[m.tipo]}">${TIPOS[m.tipo]} ${m.qtd}</span> — ${esc(m.quem)}<small>${fmt(m.criado_em)}</small></li>`).join('')
      : '<li>Nenhuma movimentação registrada.</li>';
  } catch (err) { $('histLista').innerHTML = `<li>Erro ao carregar: ${esc(err.message || err)}</li>`; }
}

/* ---------- Cadastro de item ---------- */
$('btnNovo').addEventListener('click', () => { ['itNome', 'itDesc', 'itFoto'].forEach((id) => { $(id).value = ''; }); $('itQtd').value = '1'; $('modalNovo').showModal(); });
document.querySelectorAll('[data-fechar]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));

function reduzirFoto(arquivo) {
  return new Promise((ok) => {
    if (!arquivo) return ok(null);
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * r; c.height = img.height * r;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(ok, 'image/jpeg', 0.78);
    };
    img.onerror = () => ok(null);
    img.src = URL.createObjectURL(arquivo);
  });
}

async function salvarItem() {
  if ($('btnSalvar').disabled) return;
  if (!$('itNome').value.trim()) return alert('Informe o nome do item.');
  $('btnSalvar').disabled = true;
  try {
    await db.criar({
      nome: $('itNome').value.trim(), descricao: $('itDesc').value.trim(),
      qtd: Math.max(0, parseInt($('itQtd').value, 10) || 0), fotoBlob: await reduzirFoto($('itFoto').files[0])
    }, quem());
    $('modalNovo').close();
  } catch (err) { falha(err); }
  $('btnSalvar').disabled = false;
  carregar();
}
$('btnSalvar').addEventListener('click', salvarItem);
$('formNovo').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') salvarItem(); });

/* Atualiza sozinho para todos verem o mesmo estoque (a cada 20 s, sem atrapalhar quem está digitando) */
setInterval(() => {
  if (!usuario || document.hidden || !sb) return;
  if (document.querySelector('dialog[open]') || document.activeElement.closest('#conteudo, #busca')) return;
  carregar(true);
}, 20000);

iniciar(false);
</script>
</body>
</html>
